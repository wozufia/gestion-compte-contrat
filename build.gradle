plugins {
    id 'base'
    id 'maven-publish'
}

group = 'com.awa.centrale'
version = '1.0.1'

def contractFile = layout.projectDirectory.file('gestion-compte-contrat.yml')
def stubsDir = layout.projectDirectory.dir('stubs')

def redoclyInstalled = providers.exec {
    commandLine 'bash', '-lc', 'command -v redocly >/dev/null 2>&1'
    ignoreExitValue = true
}.result.get().exitValue == 0

if (redoclyInstalled) {
    tasks.register('checkContract', Exec) {
        group = 'verification'
        description = 'Validates the OpenAPI contract.'
        commandLine 'redocly', 'lint', contractFile.asFile.absolutePath
    }
} else {
    tasks.register('checkContract') {
        group = 'verification'
        description = 'Skips contract validation because redocly is not installed.'
        doLast {
            logger.lifecycle('Skipping checkContract because redocly is not installed.')
        }
    }
}

tasks.register('testStubs', Exec) {
    group = 'verification'
    description = 'Runs WireMock stub tests.'
    commandLine 'bash', stubsDir.file('test-requests.sh').asFile.absolutePath
}

tasks.register('jar', Jar) {
    group = 'build'
    description = 'Packages the contract as a JAR.'
    archiveBaseName = 'gestion-contratv1'
    archiveVersion = ''
    destinationDirectory = layout.buildDirectory.dir('libs')
    from(contractFile) {
        into ''
    }
    manifest {
        attributes 'Manifest-Version': '1.0'
    }
}

tasks.named('assemble') {
    dependsOn tasks.named('jar')
}

tasks.named('check') {
    dependsOn tasks.named('checkContract'), tasks.named('testStubs')
}

publishing {
    repositories {
        maven {
            name = 'GitHubPackages'
            url = uri("https://maven.pkg.github.com/${System.getenv('GITHUB_REPOSITORY')}")
            credentials {
                username = System.getenv('GITHUB_ACTOR')
                password = System.getenv('GITHUB_TOKEN')
            }
        }
    }

    publications {
        contract(MavenPublication) {
            groupId = project.group
            artifactId = 'gestion-compte-contrat'
            version = project.version
            artifact(tasks.named('jar'))
        }
    }
}