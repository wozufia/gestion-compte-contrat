name: Publish Contract Artifact

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-artifact:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload contract artifact
        uses: actions/upload-artifact@v4
        with:
          name: contract-${{ github.sha }}
          path: |
            **/*
            !.git/**
            !.github/**
          if-no-files-found: error
          retention-days: 30
