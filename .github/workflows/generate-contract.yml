name: Publish Contract Artifact

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-artifact:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Upload contract artifact
        uses: actions/upload-artifact@v5
        with:
          name: gestion-contrat-v1
          path: |
            **/*
            !.git/**
            !.github/**
          if-no-files-found: error
          retention-days: 30
